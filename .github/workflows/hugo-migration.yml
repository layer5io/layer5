name: hugo-migration

on:
  push:
    branches: [hugo]
    paths:
      - 'hugo/**'
      - '.github/workflows/hugo-migration.yml'
  pull_request:
    branches: [hugo]
    paths:
      - 'hugo/**'
      - '.github/workflows/hugo-migration.yml'
  workflow_dispatch:

concurrency:
  group: "hugo-migration-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: hugo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # the Gatsby job needed far more; this is a tripwire for regressions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22     # only for migration tooling + Pagefind; not used to build the site

      # Hugo version pin: 0.162.1 (verified locally and on Linux in WSL)
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Tooling tests
        run: node --test "scripts/test/*.test.mjs"

      - name: Build site
        run: hugo --minify --gc --logLevel warn --printPathWarnings

      - name: Search index (Pagefind)
        run: npx -y pagefind --site public

      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/hugo/public" 'hugo/public/**/*.html'
          fail: true

      - name: Benchmark (1,210 synthetic pages)
        run: ./scripts/bench.sh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: hugo/public
          retention-days: 7

  # Every URL the live Gatsby site serves must still work on Hugo (P1-02, #8300).
  # Collections listed in hugo/scripts/verify-urls.allow only report. Delete a line there to make that collection a gate.
  verify-urls:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: hugo/public

      - name: URL inventory (deployed Gatsby site on gh-pages)
        run: make url-inventory

      - name: Verify URLs (MISSING per collection)
        run: make check-urls

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: url-report
          path: |
            hugo/.bench/url-inventory.json
            hugo/.bench/verify-urls.json
          retention-days: 7
