name: Build Hugo PR Preview

on:
  pull_request:
    branches: [hugo]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'hugo/**'
      - '.github/workflows/build-hugo-preview.yml'
      - '.github/workflows/deploy-hugo-preview.yml'

permissions:
  contents: read

concurrency:
  group: hugo-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PREVIEW_HOST: layer5.io

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Hugo
        if: github.event.action != 'closed'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Build Hugo PR preview
        if: github.event.action != 'closed'
        working-directory: hugo
        run: |
          hugo --minify --gc --baseURL "https://${{ env.PREVIEW_HOST }}/hugo-preview/pr-${{ github.event.pull_request.number }}/" --environment preview
          npx -y pagefind@1.6.0 --site public

      - name: Save PR Metadata
        run: |
          mkdir -p pr-meta hugo/public
          echo "${{ github.event.action }}" > pr-meta/action
          echo "${{ github.event.number }}" > pr-meta/number
          echo "${{ github.event.pull_request.head.sha }}" > pr-meta/sha
          echo "${{ github.event.pull_request.base.ref }}" > pr-meta/base_ref

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hugo-pr-preview
          path: |
            hugo/public/
            pr-meta/
          if-no-files-found: ignore
          retention-days: 7
