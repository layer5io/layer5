name: Manage PR Preview Deployment

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: preview-post-build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  manage-preview:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-preview-*
          path: temp-artifact
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          
            
      # Extract PR action from metadata uploaded by the build workflow
      - name: Read Metadata
        id: meta
        run: |
          ACTION=$(head -n1 temp-artifact/pr-meta/action 2>/dev/null | tr -d '[:space:]')
          case "$ACTION" in
            opened|reopened|synchronize|closed) ;;
            *) echo "::error::invalid or missing action: '$ACTION'"; exit 1 ;;
          esac

          PR_NUM=$(head -n1 temp-artifact/pr-meta/number 2>/dev/null | tr -d '[:space:]')
          case "$PR_NUM" in
            ''|*[!0-9]*) echo "::error::invalid or missing PR number: '$PR_NUM'"; exit 1 ;;
          esac

          SHA=$(head -n1 temp-artifact/pr-meta/sha 2>/dev/null | tr -d '[:space:]')
          case "$SHA" in
            ''|*[!a-f0-9]*) echo "::error::invalid or missing commit SHA: '$SHA'"; exit 1 ;;
          esac

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # --- BRANCH 1: DEPLOY & PRUNE (If PR is active) ---
      - name: Deploy & Prune PR previews
        if: steps.meta.outputs.action != 'closed'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./temp-artifact/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.meta.outputs.pr_number }}
          action: deploy
          max-previews: 6 # Automatically prunes previews over the limit!
          comment: false

      - name: Comment PR with Preview URL
        if: steps.meta.outputs.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.meta.outputs.pr_number }}
          message: |
            🚀 Preview deployment: https://layer5.io/pr-preview/pr-${{ steps.meta.outputs.pr_number }}/
            > *Note: Preview may take a moment (GitHub Pages deployment in progress). Please wait and refresh.*

      # --- BRANCH 2: CLEANUP ON CLOSE (If PR was closed) ---
      - name: Cleanup PR preview on close
        if: steps.meta.outputs.action == 'closed'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.meta.outputs.pr_number }}
          action: remove