name: Build PR Preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04

    if: github.event.action != 'closed'

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit


    - name: Checkout PR
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 1
    
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: 'npm'
    
    - name: Gatsby Cache
      uses: actions/cache@v4
      with:
        path: |
          .cache
        key: ${{ runner.os }}-gatsby-${{ github.event.pull_request.number }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-gatsby-${{ github.event.pull_request.number }}-
          ${{ runner.os }}-gatsby-

    - name: Install dependencies
      run: npm ci
        
    
    - name: Build PR preview
      env:
        GATSBY_PREVIEW: "true"
        GATSBY_SITE_URL: https://${{ github.repository_owner }}.github.io
      run: |
        export PATH_PREFIX=pr-preview/pr-${{ github.event.pull_request.number }}
        npm run build:preview
        echo -e "User-agent: *\nDisallow: /" > public/robots.txt


    - name: Save Metadata
      run: |
        mkdir -p public/pr-meta
        echo "${{ github.event.action }}" > public/pr-meta/action
        echo "${{ github.event.number }}" > public/pr-meta/number

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-preview-${{ github.event.pull_request.number }}
        path: public/
        retention-days: 1

  cleanup-metadata:
    runs-on: ubuntu-24.04
    if: github.event.action == 'closed'

    steps:
    - name: Create Cleanup Artifact
      run: |
        mkdir -p pr-meta
        echo "closed" > pr-meta/action
        echo "${{ github.event.number }}" > pr-meta/number

    - name: Upload Cleanup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-preview-${{ github.event.pull_request.number }}
        path: pr-meta/
        retention-days: 1
