<header class="site-header" data-pagefind-ignore>
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Layer5 home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 2 3 9l13 7 13-7z" fill="var(--accent)"/><path d="m3 15 13 7 13-7" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><path d="m3 21 13 7 13-7" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" opacity=".55"/></svg>
      <span>Layer5</span>
    </a>
    <nav class="nav" aria-label="Primary">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $menuUrl := .URL }}
        {{ with .Page }}{{ $menuUrl = .RelPermalink }}{{ end }}
        <a href="{{ $menuUrl }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="tools">
      <button class="btn-icon" type="button" data-search-open aria-label="Search the site">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="hide-sm">Search</span><kbd class="hide-sm">/</kbd>
      </button>
      <button class="btn-icon" type="button" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</header>
