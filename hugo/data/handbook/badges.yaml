  - name: Hacktoberfest '24 Contributor
    title: Hacktoberfest '24 Contributor
    badgeKey: hacktoberfest-24-contributor
    image: "https://badges.layer5.io/assets/badges/hacktoberfest-contributor-2024/layer5-hacktoberfest-badge-2024.png"
    description: Awarded to the contributors who contribute to any Layer5 project during Hacktoberfest 2024.
  - name: Hacktoberfest 2025 Contributor
    title: Hacktoberfest 2025 Contributor
    badgeKey: hacktoberfest25
    image: "https://badges.layer5.io/assets/badges/hacktoberfest-contributor-2025/hacktoberfest25-badge.png"
    description: Awarded to community members who participate in Hacktoberfest 2025 by making meaningful contributions to Layer5 projects during the month of October 2025.
