  - name: Security Sentinel
    title: Security Sentinel
    badgeKey: security-sentinel
    image: /images/security-sentinel/security-sentinel.webp
    description: Awarded to individuals who contribute to identifying and fixing security vulnerabilities.
  - name: Longevity Legend
    title: Longevity Legend
    badgeKey: longevity-legend
    image: /images/longevity-legend/longevity-legend.svg
    description: Awarded for long-term, sustained contributions to the project over the years.
  - name: Review Rockstar
    title: Review Rockstar
    badgeKey: review-rockstar
    image: /images/review-rockstar/review-rockstar.svg
    description: Awarded to individuals who provide thorough and valuable code reviews.
